<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Змійка</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      margin: 0;
      background: #17212b;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #score-board {
      font-size: 20px;
      margin-bottom: 10px;
      font-weight: bold;
    }
    canvas {
      background: #0e1621;
      border: 2px solid #5288c1;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 70px);
      grid-template-rows: repeat(2, 60px);
      gap: 10px;
      margin-top: 15px;
    }
    .btn {
      background: #2b5278;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn:active { background: #5288c1; }
    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

  <div id="score-board">Рахунок: <span id="score">0</span></div>
  <canvas id="game" width="320" height="320"></canvas>

  <!-- Кнопки керування для смартфона -->
  <div class="controls">
    <button class="btn btn-up" onclick="setDir('UP')">⬆️</button>
    <button class="btn btn-left" onclick="setDir('LEFT')">⬅️</button>
    <button class="btn btn-down" onclick="setDir('DOWN')">⬇️</button>
    <button class="btn btn-right" onclick="setDir('RIGHT')">➡️</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.ready();

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const grid = 16;
    const count = canvas.width / grid;

    let score = 0;
    let snake = [{x: 10, y: 10}];
    let food = {x: 5, y: 5};
    let dx = 1, dy = 0;
    let nextDx = 1, nextDy = 0;
    
    // Налаштування швидкості (у мілісекундах)
    let baseSpeed = 160; // Початкова комфортна швидкість
    let currentSpeed = baseSpeed;
    let minSpeed = 60;   // Максимальне прискорення
    let gameLoopTimeout = null;

    function generateFood() {
      food.x = Math.floor(Math.random() * count);
      food.y = Math.floor(Math.random() * count);
    }

    function setDir(dir) {
      if (dir === 'UP' && dy === 0) { nextDx = 0; nextDy = -1; }
      if (dir === 'DOWN' && dy === 0) { nextDx = 0; nextDy = 1; }
      if (dir === 'LEFT' && dx === 0) { nextDx = -1; nextDy = 0; }
      if (dir === 'RIGHT' && dx === 0) { nextDx = 1; nextDy = 0; }
    }

    // Зчитування клавіш на ПК
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp") setDir('UP');
      if (e.key === "ArrowDown") setDir('DOWN');
      if (e.key === "ArrowLeft") setDir('LEFT');
      if (e.key === "ArrowRight") setDir('RIGHT');
    });

    function resetGame() {
      alert(`Гра закінчена! Ваш рахунок: ${score}`);
      score = 0;
      document.getElementById("score").innerText = score;
      snake = [{x: 10, y: 10}];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      currentSpeed = baseSpeed; // Скидаємо швидкість до початкової
      generateFood();
    }

    function update() {
      dx = nextDx;
      dy = nextDy;

      const head = {x: snake[0].x + dx, y: snake[0].y + dy};

      // Перевірка зіткнення зі стінами або собою
      if (
        head.x < 0 || head.x >= count || 
        head.y < 0 || head.y >= count ||
        snake.some(segment => segment.x === head.x && segment.y === head.y)
      ) {
        resetGame();
        return;
      }

      snake.unshift(head);

      // Перевірка поїдання їжі
      if (head.x === food.x && head.y === food.y) {
        score += 1;
        document.getElementById("score").innerText = score;
        generateFood();

        // Поступове прискорення: кожні 2 ягоди швидкість збільшується на 5 мс
        if (currentSpeed > minSpeed) {
          currentSpeed -= 5;
        }
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.fillStyle = "#0e1621";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Малюємо їжу
      ctx.fillStyle = "#e53935";
      ctx.fillRect(food.x * grid, food.y * grid, grid - 1, grid - 1);

      // Малюємо змійку
      ctx.fillStyle = "#4caf50";
      snake.forEach((segment, index) => {
        if (index === 0) ctx.fillStyle = "#81c784"; // Голова світліша
        else ctx.fillStyle = "#4caf50";
        ctx.fillRect(segment.x * grid, segment.y * grid, grid - 1, grid - 1);
      });
    }

    function loop() {
      update();
      draw();
      // Запускаємо наступний кадр з актуальною затримкою
      gameLoopTimeout = setTimeout(loop, currentSpeed);
    }

    // Запуск гри
    loop();
  </script>
</body>
</html>
