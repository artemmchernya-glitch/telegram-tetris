<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Дорогоцінні Камінці</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { 
      box-sizing: border-box; 
      touch-action: manipulation;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #17212b 0%, #0a0e1b 100%);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    h1 {
      font-size: 32px;
      margin: 15px 0;
      text-shadow: 0 0 15px rgba(76, 175, 80, 0.5);
    }

    .game-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      width: 100%;
    }

    .stats-container {
      display: flex;
      flex-direction: row;
      gap: 10px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 100%;
    }

    .stat-box {
      text-align: center;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(76, 175, 80, 0.3);
      border-radius: 6px;
      min-width: 70px;
    }

    .stat-label {
      font-size: 8px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 14px;
      font-weight: bold;
      color: #4caf50;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-gap: 8px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.3);
      border: 3px solid #4caf50;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(76, 175, 80, 0.3);
    }

    .game-cell {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.1s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(76, 175, 80, 0.3);
    }

    .game-cell:active {
      transform: scale(0.95);
    }

    .game-cell.selected {
      border: 3px solid #FFD700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }

    .status-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .status-btn {
      padding: 12px 24px;
      background: #4caf50;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 8px rgba(76, 175, 80, 0.3);
    }

    .status-btn:active {
      transform: scale(0.95);
    }

    .status-btn:hover {
      background: #5CBF60;
    }

    .status-btn.secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid #4caf50;
    }

    .status-btn.secondary:hover {
      background: rgba(76, 175, 80, 0.2);
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex !important;
    }

    .modal-content {
      background: linear-gradient(135deg, #1a2332 0%, #0a0e1b 100%);
      border: 2px solid #4caf50;
      border-radius: 16px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 0 50px rgba(76, 175, 80, 0.4);
      animation: slideUp 0.3s ease;
      max-width: 90%;
    }

    @keyframes slideUp {
      from {
        transform: translateY(50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal h1 {
      font-size: 42px;
      color: #e53935;
      margin: 0 0 20px 0;
      text-shadow: 0 0 20px rgba(229, 57, 53, 0.5);
    }

    .modal-stats {
      margin: 30px 0;
      text-align: left;
    }

    .modal-stat-row {
      display: flex;
      justify-content: space-between;
      padding: 12px;
      border-bottom: 1px solid rgba(76, 175, 80, 0.2);
      font-size: 16px;
    }

    .modal-stat-row:last-child {
      border-bottom: none;
    }

    .modal-stat-label {
      color: #888;
    }

    .modal-stat-value {
      font-weight: bold;
      color: #4caf50;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .modal-btn {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-btn.restart {
      background: #4caf50;
      color: #000;
      flex: 1;
      min-width: 150px;
    }

    .modal-btn.restart:active {
      transform: scale(0.95);
    }

    .modal-btn.menu {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid #4caf50;
      flex: 1;
      min-width: 150px;
    }

    /* Moves display */
    .moves-display {
      font-size: 18px;
      font-weight: bold;
      color: #FF6B6B;
    }

    /* Particle effect */
    canvas#particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 500;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 24px;
      }

      .game-board {
        grid-template-columns: repeat(5, 45px);
      }

      .game-cell {
        width: 45px;
        height: 45px;
        font-size: 24px;
      }

      .modal-content {
        padding: 25px 20px;
      }

      .modal h1 {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <h1>💎 ДОРОГОЦІННІ КАМІНЦІ</h1>

  <div class="game-container">
    <div class="game-board" id="gameBoard"></div>
    
    <div class="stats-container">
      <div class="stat-box">
        <div class="stat-label">Рахунок</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Рекорд</div>
        <div class="stat-value" id="highScore">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Ходи</div>
        <div class="stat-value moves-display" id="moves">30</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Комбо</div>
        <div class="stat-value" id="combo">0x</div>
      </div>
    </div>
  </div>

  <div class="status-buttons">
    <button class="status-btn" id="restartBtn" onclick="startNewGame()">🔄 НОВА ГРА</button>
    <button class="status-btn secondary" id="undoBtn" onclick="undoMove()">↶ СКАСУВАТИ</button>
  </div>

  <!-- Game Over Modal -->
  <div class="modal" id="gameOverModal">
    <div class="modal-content">
      <h1>ГОРА ЗАКІНЧЕНА</h1>
      <div class="modal-stats">
        <div class="modal-stat-row">
          <span class="modal-stat-label">Фінальний рахунок:</span>
          <span class="modal-stat-value" id="finalScore">0</span>
        </div>
        <div class="modal-stat-row">
          <span class="modal-stat-label">Рекорд:</span>
          <span class="modal-stat-value" id="finalHighScore">0</span>
        </div>
        <div class="modal-stat-row">
          <span class="modal-stat-label">Заробив ходів:</span>
          <span class="modal-stat-value" id="finalMoves">0</span>
        </div>
        <div class="modal-stat-row" id="newRecordRow" style="display: none; color: #FFD700;">
          <span>🎉 НОВИЙ РЕКОРД! 🎉</span>
        </div>
      </div>
      <div class="modal-buttons">
        <button class="modal-btn restart" onclick="startNewGame()">ГРАТИ ЩЕ РАЗ</button>
        <button class="modal-btn menu" onclick="location.reload()">МЕНЮ</button>
      </div>
    </div>
  </div>

  <canvas id="particleCanvas"></canvas>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const particleCanvas = document.getElementById("particleCanvas");
    const particleCtx = particleCanvas.getContext("2d");
    
    particleCanvas.width = window.innerWidth;
    particleCanvas.height = window.innerHeight;

    const COLS = 6;
    const ROWS = 6;
    const GEMS = ['💎', '💍', '👑', '🔮', '✨', '🌟'];
    const COLORS = {
      '💎': '#4caf50',
      '💍': '#FF6B9D',
      '👑': '#FFD700',
      '🔮': '#9C27B0',
      '✨': '#00BCD4',
      '🌟': '#FFC107'
    };

    let board = [];
    let score = 0;
    let highScore = localStorage.getItem('match3HighScore') || 0;
    let moves = 30;
    let combo = 0;
    let selectedCell = null;
    let gameActive = true;
    let particles = [];
    let gameHistory = [];

    document.getElementById('highScore').innerText = highScore;

    function initBoard() {
      board = [];
      for (let y = 0; y < ROWS; y++) {
        board[y] = [];
        for (let x = 0; x < COLS; x++) {
          board[y][x] = GEMS[Math.floor(Math.random() * GEMS.length)];
        }
      }
      
      while (checkForMatches()) {
        removeMatches();
        dropGems();
      }
    }

    function renderBoard() {
      const gameBoard = document.getElementById('gameBoard');
      gameBoard.innerHTML = '';

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const cell = document.createElement('button');
          cell.className = 'game-cell';
          cell.textContent = board[y][x];
          
          if (selectedCell && selectedCell.x === x && selectedCell.y === y) {
            cell.classList.add('selected');
          }

          cell.onclick = () => selectCell(x, y);
          gameBoard.appendChild(cell);
        }
      }
    }

    function selectCell(x, y) {
      if (!gameActive) return;

      if (!selectedCell) {
        selectedCell = { x, y };
        renderBoard();
        return;
      }

      // Перевірка сусідності
      const dist = Math.abs(selectedCell.x - x) + Math.abs(selectedCell.y - y);
      if (dist !== 1) {
        selectedCell = { x, y };
        renderBoard();
        return;
      }

      // Обміняємо камінці
      saveHistory();
      [board[selectedCell.y][selectedCell.x], board[y][x]] = 
      [board[y][x], board[selectedCell.y][selectedCell.x]];
      
      selectedCell = null;
      moves--;
      document.getElementById('moves').innerText = moves;

      // Перевіряємо збіги
      if (checkForMatches()) {
        processMatches();
      } else {
        // Якщо нема збігів - повертаємо назад
        loadHistory();
        moves++;
        document.getElementById('moves').innerText = moves;
      }

      checkGameOver();
    }

    function checkForMatches() {
      // Перевірка горизонталей
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS - 2; x++) {
          if (board[y][x] && 
              board[y][x] === board[y][x + 1] && 
              board[y][x] === board[y][x + 2]) {
            return true;
          }
        }
      }

      // Перевірка вертикалей
      for (let y = 0; y < ROWS - 2; y++) {
        for (let x = 0; x < COLS; x++) {
          if (board[y][x] && 
              board[y][x] === board[y + 1][x] && 
              board[y][x] === board[y + 2][x]) {
            return true;
          }
        }
      }

      return false;
    }

    function removeMatches() {
      let removed = [];

      // Горизонтальні збіги
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS - 2; x++) {
          if (board[y][x] && 
              board[y][x] === board[y][x + 1] && 
              board[y][x] === board[y][x + 2]) {
            
            for (let i = 0; i < 3; i++) {
              removed.push({x: x + i, y: y, gem: board[y][x + i]});
              board[y][x + i] = null;
            }
          }
        }
      }

      // Вертикальні збіги
      for (let y = 0; y < ROWS - 2; y++) {
        for (let x = 0; x < COLS; x++) {
          if (board[y][x] && 
              board[y][x] === board[y + 1][x] && 
              board[y][x] === board[y + 2][x]) {
            
            for (let i = 0; i < 3; i++) {
              const alreadyRemoved = removed.some(r => r.x === x && r.y === y + i);
              if (!alreadyRemoved) {
                removed.push({x: x, y: y + i, gem: board[y + i][x]});
                board[y + i][x] = null;
              }
            }
          }
        }
      }

      // Частинки для видалених камінців
      removed.forEach(r => {
        const cellX = r.x * 65 + 40;
        const cellY = r.y * 65 + 150;
        createParticles(cellX, cellY, COLORS[r.gem]);
      });

      score += removed.length * 10;
      playSound(800, 0.1);
    }

    function dropGems() {
      for (let x = 0; x < COLS; x++) {
        for (let y = ROWS - 1; y >= 0; y--) {
          if (!board[y][x]) {
            let above = y - 1;
            while (above >= 0 && !board[above][x]) {
              above--;
            }

            if (above >= 0) {
              board[y][x] = board[above][x];
              board[above][x] = null;
            } else {
              board[y][x] = GEMS[Math.floor(Math.random() * GEMS.length)];
            }
          }
        }
      }
    }

    function processMatches() {
      removeMatches();
      dropGems();
      combo++;
      document.getElementById('combo').innerText = combo + 'x';

      if (checkForMatches()) {
        setTimeout(() => processMatches(), 300);
      } else {
        combo = 0;
        document.getElementById('combo').innerText = '0x';
      }

      document.getElementById('score').innerText = score;
      renderBoard();
    }

    function playSound(freq, duration) {
      try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.frequency.value = freq;
        oscillator.type = 'sine';
        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + duration);
      } catch (e) {}
    }

    function createParticles(x, y, color) {
      const particleCount = 8;
      for (let i = 0; i < particleCount; i++) {
        const angle = (Math.PI * 2 * i) / particleCount;
        const velocity = 3 + Math.random() * 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * velocity,
          vy: Math.sin(angle) * velocity,
          life: 1,
          color: color
        });
      }
    }

    function updateParticles() {
      particleCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
      particles = particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life -= 0.02;
        
        if (p.life > 0) {
          particleCtx.globalAlpha = p.life;
          particleCtx.fillStyle = p.color;
          particleCtx.fillRect(p.x - 2, p.y - 2, 4, 4);
          return true;
        }
        return false;
      });
      particleCtx.globalAlpha = 1;
    }

    function saveHistory() {
      gameHistory = JSON.parse(JSON.stringify(board));
    }

    function loadHistory() {
      board = JSON.parse(JSON.stringify(gameHistory));
      renderBoard();
    }

    function undoMove() {
      if (gameHistory.length > 0) {
        loadHistory();
      }
    }

    function checkGameOver() {
      if (moves <= 0) {
        gameActive = false;
        setTimeout(() => {
          const isNewRecord = score > highScore;
          if (isNewRecord) {
            highScore = score;
            localStorage.setItem('match3HighScore', highScore);
            playSound(1200, 0.3);
          }

          document.getElementById('finalScore').innerText = score;
          document.getElementById('finalHighScore').innerText = highScore;
          document.getElementById('finalMoves').innerText = moves;
          document.getElementById('newRecordRow').style.display = isNewRecord ? 'flex' : 'none';
          document.getElementById('gameOverModal').classList.add('active');
        }, 300);
      }
    }

    function startNewGame() {
      document.getElementById('gameOverModal').classList.remove('active');
      score = 0;
      moves = 30;
      combo = 0;
      selectedCell = null;
      gameActive = true;
      gameHistory = [];
      document.getElementById('score').innerText = score;
      document.getElementById('moves').innerText = moves;
      document.getElementById('combo').innerText = '0x';
      initBoard();
      renderBoard();
    }

    // Keyboard controls
    document.addEventListener("keydown", (e) => {
      if (e.key === "z" && e.ctrlKey) {
        undoMove();
      }
    });

    // Start game
    document.addEventListener('DOMContentLoaded', () => {
      startNewGame();
    });

    // Animation loop
    setInterval(updateParticles, 16);
  </script>
</body>
</html>
